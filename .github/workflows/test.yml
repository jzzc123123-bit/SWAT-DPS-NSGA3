name: Method and minimal-case checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -v
      - run: python examples/minimal_case/run.py --output results/ci
  fortran-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: python tools/build_swat.py --compiler gfortran --oracle --output build/oracle
      - run: python tools/check_fortran_policy.py --executable build/oracle/policy_oracle
      - run: python tools/build_swat.py --compiler gfortran --output build/swat
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fortran-build-logs
          path: |
            build/oracle/compile.log
            build/swat/compile.log
